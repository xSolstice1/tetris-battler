<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Block Brawl</title>
  <meta name="description" content="Block Brawl: a falling-block battler. Classic mode, a gauntlet of monsters, or a 1v1 against a shadow opponent.">
  <style>
    html, body, canvas {
      margin: 0; padding: 0; width: 100%; height: 100%;
      overflow: hidden; position: absolute; background: #0b0d14;
    }
    #hint {
      position: absolute; top: 8px; width: 100%; text-align: center;
      font: 13px system-ui, sans-serif; color: #5d6680; pointer-events: none;
    }
  </style>
</head>
<body>
  <canvas id="glcanvas" tabindex="1"></canvas>
  <div id="hint">Click the game if keys don't respond. Sound starts after your first key press or click.</div>
  <noscript>Block Brawl needs JavaScript and WebAssembly.</noscript>
  <!-- The bundled (unused) networking plugin assigns this global without
       declaring it, which throws under the bundle's "use strict". -->
  <script>var register_plugin;</script>
  <script src="mq_js_bundle.js"></script>
  <script>
    // Saved progress (see src/save.rs): one localStorage entry, read in two steps
    // (length, then copy into a buffer the game allocated).
    (function () {
      const KEY = "block-brawl.save";
      let pending = new Uint8Array(0);
      miniquad_add_plugin({
        name: "bb_storage",
        version: 1,
        register_plugin(importObject) {
          importObject.env.bb_storage_load = function () {
            let text = null;
            try { text = localStorage.getItem(KEY); } catch (e) { console.warn("save unavailable", e); }
            if (text === null) return -1;
            pending = new TextEncoder().encode(text);
            return pending.length;
          };
          importObject.env.bb_storage_take = function (ptr) {
            new Uint8Array(wasm_memory.buffer, ptr, pending.length).set(pending);
            pending = new Uint8Array(0);
          };
          importObject.env.bb_storage_store = function (ptr, len) {
            const text = new TextDecoder().decode(new Uint8Array(wasm_memory.buffer, ptr, len));
            try { localStorage.setItem(KEY, text); } catch (e) { console.warn("could not save", e); }
          };
        },
      });
    })();
  </script>
  <script>
    load("block-brawl.wasm");
    // Hide the hint once the player has interacted (key or click).
    const hideHint = () => document.getElementById("hint")?.remove();
    addEventListener("keydown", hideHint, { once: true });
    addEventListener("pointerdown", hideHint, { once: true });
  </script>
</body>
</html>
