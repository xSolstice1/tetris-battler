<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Block Brawl</title>
  <meta name="description" content="Block Brawl: a falling-block battler. Classic mode, or beat a gauntlet of monsters before time runs out.">
  <style>
    html, body, canvas {
      margin: 0; padding: 0; width: 100%; height: 100%;
      overflow: hidden; position: absolute; background: #0b0d14;
    }
    #hint {
      position: absolute; top: 8px; width: 100%; text-align: center;
      font: 13px system-ui, sans-serif; color: #5d6680; pointer-events: none;
    }
  </style>
</head>
<body>
  <canvas id="glcanvas" tabindex="1"></canvas>
  <div id="hint">Click the game if keys don't respond. Sound starts after your first key press or click.</div>
  <noscript>Block Brawl needs JavaScript and WebAssembly.</noscript>
  <!-- The bundled (unused) networking plugin assigns this global without
       declaring it, which throws under the bundle's "use strict". -->
  <script>var register_plugin;</script>
  <script src="mq_js_bundle.js"></script>
  <script>
    load("block-brawl.wasm");
    // Hide the hint once the player has interacted (key or click).
    const hideHint = () => document.getElementById("hint")?.remove();
    addEventListener("keydown", hideHint, { once: true });
    addEventListener("pointerdown", hideHint, { once: true });
  </script>
</body>
</html>
